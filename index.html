<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestion École</title>
<meta name="description" content="Gestion École : plateforme de gestion scolaire pour la maternelle, le primaire, le collège / lycée et le supérieur.">
<meta name="theme-color" content="#0d2147">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d6fe8'/%3E%3Cpath d='M32 14 8 26l24 12 24-12z' fill='white'/%3E%3Cpath d='M18 34v10c8 8 20 8 28 0V34' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fb;--card:#fff;--text:#13203a;--muted:#6a7893;--line:#e1e8f4;--blue:#1d6fe8;--blue2:#0f4fb8;--navy:#0d2147;--logo:#0d2147;--sjl:92%;--sjs:78%;--sjt:#13203a;--navy2:#143063;--green:#17a673;--orange:#f08a1c;--purple:#7240e0;--red:#e5484d;--soft:#f5f8fe;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1326;--card:#121c36;--text:#e8eefc;--muted:#93a2c4;--line:#22305a;--soft:#17234a;--logo:#e8eefc;--sjl:26%;--sjs:45%;--sjt:#eef3ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1326;--card:#121c36;--text:#e8eefc;--muted:#93a2c4;--line:#22305a;--soft:#17234a;--logo:#e8eefc;--sjl:26%;--sjs:45%;--sjt:#eef3ff;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5}
h1,h2,h3,h4{margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--blue2)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #7fb0ff;outline-offset:2px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.ghost:hover{background:var(--soft)}
.btn.green{background:var(--green)}.btn.green:hover{background:#108a5e}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn.red{background:var(--red)}
.btn.light{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.6);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end;margin-top:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px}
.logo .mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#1d6fe8,#0b3d91);display:grid;place-items:center;color:#fff}
.logo .mark svg{width:24px;height:24px}
.logo b{font-size:18px;display:block;color:var(--logo)}
.logo small{display:block;font-weight:500;font-size:10px;color:var(--muted)}
/* PUBLIC */
.pub-head{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px clamp(16px,4vw,48px);gap:16px}
.pub-nav{display:flex;gap:26px;align-items:center}
.pub-nav a{font-weight:600;color:var(--text);text-decoration:none;cursor:pointer;padding:6px 0;border-bottom:2px solid transparent}
.pub-nav a:hover{border-color:var(--blue);color:var(--blue)}
.hero{position:relative;min-height:560px;background:linear-gradient(100deg,#08183a 0%,#0d2c66 55%,#1a56b8 100%);color:#fff;overflow:hidden;display:flex;align-items:center}
.hero .txt{position:relative;z-index:2;padding:60px clamp(20px,6vw,80px);max-width:640px}
.hero h1{font-size:clamp(38px,6vw,64px);font-weight:800;letter-spacing:-1px}
.hero h2{font-size:clamp(20px,2.6vw,28px);margin:14px 0 14px;font-weight:700}
.hero p{font-size:16px;opacity:.92;max-width:520px;margin:0 0 26px}
.hero svg.art{position:absolute;right:0;bottom:0;height:100%;width:min(62%,780px);z-index:1}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;max-width:1180px;margin:-44px auto 0;padding:0 20px;position:relative;z-index:5}
.strip div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(13,33,71,.12)}
.strip svg{width:30px;height:30px;color:var(--blue);display:block;margin:0 auto 8px}
.sec{max-width:1180px;margin:0 auto;padding:70px 20px 10px}
.sec h2{font-size:30px;margin-bottom:10px;color:var(--text)}
.sec .lead{color:var(--muted);max-width:640px;margin-bottom:28px;font-size:15px}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feat article{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.feat .fi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;margin-bottom:12px}
.feat h3{font-size:16px;margin-bottom:6px}.feat p{margin:0;color:var(--muted)}
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.about .box{background:linear-gradient(135deg,var(--navy),#1a56b8);color:#fff;border-radius:20px;padding:30px}
.about .box .n{font-size:38px;font-weight:800}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.contact form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:12px}
.footbar{margin-top:70px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px clamp(16px,4vw,48px);flex-wrap:wrap}
.footbar .logo b{color:#fff}
.footbar .pts{display:flex;gap:26px;flex-wrap:wrap}
.footbar .pts span{display:flex;gap:8px;align-items:center;font-weight:600}
.hb{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:12px}
.hb>div{background:var(--soft);border-radius:99px;height:10px;overflow:hidden}.hb i{display:block;height:100%;border-radius:99px}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.qa button{display:grid;justify-items:center;gap:6px;padding:14px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;font-weight:700;font-size:12px;color:var(--text)}
.qa button:hover{border-color:var(--blue);background:var(--soft)}.qa svg{width:22px;height:22px;color:var(--blue)}
.lvh{margin:20px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}.lvh small{color:var(--muted)}
/* forms */
.fl{display:grid;gap:5px;font-weight:600;font-size:12px;color:var(--muted)}
input,select,textarea{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;color:var(--text)}
input[type=checkbox]{width:auto}
textarea{min-height:90px;resize:vertical}
/* LOGIN */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(120deg,#0b2a5b,#1a56b8)}
.login .left{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:30px}
.login .left svg.bld{position:absolute;inset:0;width:100%;height:100%}
.lcard{position:relative;z-index:2;background:var(--card);border-radius:20px;padding:30px;width:min(430px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);display:grid;gap:14px}
.lcard h2{text-align:center;color:var(--blue);font-size:26px;letter-spacing:.5px}
.lcard .sub{text-align:center;color:var(--muted);margin-top:-8px}
.err{background:#fde8e8;color:#a1262b;border-radius:10px;padding:9px 12px;font-weight:600}
.roles{background:var(--card);margin:30px 30px 30px 0;border-radius:20px;padding:26px;align-self:center;display:grid;gap:10px}
.roles h3{margin-bottom:6px}
.role{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.role:hover,.role.on{border-color:var(--blue);background:var(--soft)}
.role .ri{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff}
.role b{display:block}.role small{color:var(--muted)}
/* APP */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--navy),#0a1a3a);color:#c9d9f7;position:sticky;top:0;height:100vh;overflow:auto;padding:16px 12px;z-index:30}
.side .logo b{color:#fff;font-size:15px}
.side nav{margin-top:22px;display:grid;gap:3px}
.side nav a{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:9px;color:#c9d9f7;text-decoration:none;font-weight:600;font-size:13px;cursor:pointer}
.side nav a:hover{background:rgba(255,255,255,.08)}
.side nav a.on{background:var(--blue);color:#fff}
.main{padding:18px clamp(14px,2.2vw,30px) 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}
.top h1{font-size:22px}.top p{margin:3px 0 0;color:var(--muted)}
.who{display:flex;align-items:center;gap:12px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1d6fe8,#7240e0);color:#fff;display:grid;place-items:center;font-weight:800}
.burger{display:none}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.4fr 1fr 1fr}.gh{grid-template-columns:1fr 1fr}
.stat{border-radius:16px;color:#fff;padding:18px;display:flex;gap:14px;align-items:center}
.stat svg.ic{width:38px;height:38px}
.stat b{font-size:30px;display:block;line-height:1}.stat span{display:block;font-weight:600;margin-top:2px}.stat small{opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card h3{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 a{font-size:12px;font-weight:600;cursor:pointer}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
th{color:var(--muted);font-weight:700;font-size:12px;background:var(--soft)}
td.c,th.c{text-align:center}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#d9f5e8;color:#0b7a50}
.pill.o{background:#fff0d9;color:#a05a00}.pill.b{background:#dfeaff;color:#1b4fb0}.pill.p{background:#ece4ff;color:#5b30b8}.pill.r{background:#fde8e8;color:#a1262b}
.act{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.act:last-child{border:0}
.act i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;font-style:normal}
.act small{color:var(--muted);display:block}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:var(--soft);padding:8px 14px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--blue);color:#fff}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filters .fl{min-width:150px;flex:1}
.num{width:78px;text-align:center;padding:6px}
.tt td{text-align:center;font-size:12px}.tt td b{display:block}.tt td small{color:var(--muted)}
.tt td.e{color:var(--muted)}
.donutw{display:flex;flex-direction:column;align-items:center;gap:10px}
.leg{width:100%;display:grid;gap:6px}.leg div{display:flex;justify-content:space-between;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:16px;padding:16px;color:#fff;display:grid;gap:8px}
.tile svg.ic{width:26px;height:26px}.tile b{font-size:26px;line-height:1}.tile small{opacity:.9;font-weight:600}
.bnav{display:none}
#modal{position:fixed;inset:0;background:rgba(6,14,32,.6);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow:auto;padding:24px 12px}
#modal.on{display:flex}
.mcard{background:var(--card);border-radius:18px;padding:22px;width:min(480px,100%);box-shadow:0 20px 60px rgba(0,0,0,.4);display:grid;gap:12px}
.mcard.wide{width:min(820px,100%);background:var(--bg)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;max-width:90vw}
#toast.on{opacity:1}
/* documents */
.sheet{background:#fff;color:#14203c;border:1px solid #cfd9ec;border-radius:6px;padding:30px;font-family:Georgia,'Times New Roman',serif}
.sheet h2{font-family:'Plus Jakarta Sans',system-ui,sans-serif;text-align:center;color:#0f4fb8;margin:14px 0}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid #1d6fe8;padding-bottom:10px;flex-wrap:wrap}
.sheet table th{background:#eaf1ff;color:#14203c}.sheet td,.sheet th{border-color:#d6e1f5}
.sheet .logo b{color:#0d2147}
.sig{font-family:'Brush Script MT','Segoe Script',cursive;font-size:30px;color:#1b3f9a;transform:rotate(-4deg);display:inline-block}
.sig-img{max-height:70px;max-width:200px}
.sheet .kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin:14px 0}
.stamp{width:78px;height:78px;border:3px double #1d6fe8;border-radius:50%;display:grid;place-items:center;color:#1d6fe8;font:700 9px 'Plus Jakarta Sans',sans-serif;text-align:center;opacity:.8;transform:rotate(-12deg)}
.docl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.docl:last-child{border:0}.docl .fi{color:var(--red)}
.sigbox{border:2px dashed var(--line);border-radius:12px;min-height:110px;display:grid;place-items:center;padding:10px;margin-bottom:12px;background:var(--soft)}
.dupok{color:var(--green);font-weight:700}.dupko{color:var(--red);font-weight:700}
.avimg{border-radius:50%;object-fit:cover;display:block;flex:none}.avdef{border-radius:50%;background:var(--soft);color:var(--muted);display:inline-grid;place-items:center;flex:none;border:1.5px solid var(--line)}.avdef svg{width:55%;height:55%}.avl{cursor:pointer;display:inline-block}.avl:hover .avdef,.avl:hover .avimg{outline:2px solid var(--blue);outline-offset:1px}.av.avb{border:0;cursor:pointer;overflow:hidden;padding:0}.av.avb img{width:100%;height:100%;object-fit:cover}.av.avb svg{width:18px;height:18px}
@media (prefers-reduced-motion:no-preference){
.hero{background-size:220% 220%;animation:gradmove 16s ease-in-out infinite}
@keyframes gradmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.hero .orbs i{position:absolute;border-radius:50%;filter:blur(46px);opacity:.45;animation:drift 15s ease-in-out infinite}
.hero .orbs i:nth-child(1){width:340px;height:340px;background:#2f7bff;left:-90px;top:-70px}
.hero .orbs i:nth-child(2){width:280px;height:280px;background:#7240e0;right:22%;bottom:-90px;animation-delay:-5s}
.hero .orbs i:nth-child(3){width:220px;height:220px;background:#17a673;right:-50px;top:18%;animation-delay:-9s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(46px,-34px) scale(1.18)}}
.hero svg.art{animation:floaty 9s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.chips span{animation:bob 5.5s ease-in-out infinite}.chips span:nth-child(2){animation-delay:-1.5s}.chips span:nth-child(3){animation-delay:-3s}.chips span:nth-child(4){animation-delay:-4.2s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(4deg)}}
.up{opacity:0;transform:translateY(24px);animation:up .85s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.btn.shine{position:relative;overflow:hidden}.btn.shine::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:140%}}
.pub-head .logo .mark{animation:pulse 3.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(29,111,232,.45)}50%{box-shadow:0 0 0 9px rgba(29,111,232,0)}}
.strip div,.feat article,.lvl4 article,.nums div{transition:transform .25s ease,box-shadow .25s ease,opacity .7s ease}
.strip div:hover,.feat article:hover,.lvl4 article:hover,.nums div:hover{transform:translateY(-7px);box-shadow:0 16px 34px rgba(13,33,71,.18)}
}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
.hero .orbs{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.hero .chips span{position:absolute;width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;color:#fff;z-index:2}
.hero .chips span svg{width:26px;height:26px}
.hero .chips span:nth-child(1){top:14%;right:12%}.hero .chips span:nth-child(2){top:42%;right:3%}.hero .chips span:nth-child(3){top:64%;right:30%}.hero .chips span:nth-child(4){top:22%;right:40%}
.rot{font-size:18px;font-weight:600;margin:0 0 14px;opacity:.95}.rot b{display:inline-block;color:#8fc1ff;transition:opacity .35s ease,transform .35s ease}.rot b.out{opacity:0;transform:translateY(-8px)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;text-align:center}.nums div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 12px}.nums b{display:block;font-size:42px;font-weight:800;color:var(--blue);line-height:1.1}.nums span{color:var(--muted);font-weight:600}
@media(max-width:860px){.hero .chips{display:none}.nums{grid-template-columns:1fr 1fr}}
#splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 30% 20%,#1a56b8 0%,#0d2c66 45%,#08183a 100%);overflow:hidden;cursor:pointer;transition:transform .95s cubic-bezier(.77,0,.18,1)}
#splash.hide{transform:translateY(-100%)}
body.splashing{overflow:hidden}body.splashing .up{animation-play-state:paused}
#splash .sp-orb{position:absolute;border-radius:50%;filter:blur(50px);opacity:.45;animation:drift 12s ease-in-out infinite}
#splash .sp-orb.a{width:340px;height:340px;background:#2f7bff;left:-80px;top:-60px}#splash .sp-orb.b{width:300px;height:300px;background:#7240e0;right:-60px;bottom:-60px;animation-delay:-5s}
#splash .sp-in{position:relative;text-align:center;display:grid;justify-items:center;gap:18px;padding:20px}
#splash .sp-mark{position:relative;width:96px;height:96px;border-radius:26px;background:linear-gradient(135deg,#2f7bff,#0b3d91);display:grid;place-items:center;box-shadow:0 18px 50px rgba(20,90,220,.55);animation:spin-in 1s cubic-bezier(.2,.8,.2,1) both}
#splash .sp-mark svg{width:52px;height:52px;stroke-width:1.7}
#splash .sp-mark::before{content:'';position:absolute;inset:-12px;border-radius:34px;border:2px solid transparent;border-top-color:#8fc1ff;border-right-color:rgba(143,193,255,.4);animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin-in{from{opacity:0;transform:scale(.3) rotate(-140deg)}to{opacity:1;transform:none}}
#splash .sp-name{font-size:clamp(26px,6vw,44px);font-weight:800;letter-spacing:.06em;display:flex;gap:.02em;flex-wrap:wrap;justify-content:center}

function countUp(el){const to=+el.dataset.to,suf=el.dataset.suf||'',t0=performance.now();const step=t=>{const p=Math.min(1,(t-t0)/1400),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e)+suf;if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function pubFx(){
 const rm=typeof matchMedia!=='undefined'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 const nums=[...document.querySelectorAll('[data-to]')];
 if(rm||typeof IntersectionObserver==='undefined'){nums.forEach(el=>{el.textContent=el.dataset.to+(el.dataset.suf||'')});return}
 document.querySelectorAll('.strip div,.sec h2,.sec .lead,.feat article,.lvl4 article,.about>*,.contact>*,.nums div').forEach((el,i)=>{el.classList.add('reveal');el.style.transitionDelay=((i%6)*70)+'ms'});
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;io.unobserve(el);if(el.dataset.to!==undefined){countUp(el);return}el.classList.add('in');setTimeout(()=>{el.style.transitionDelay=''},1000)}),{threshold:.15});
 document.querySelectorAll('.reveal').forEach(el=>io.observe(el));nums.forEach(el=>io.observe(el));
 const w=document.getElementById('rotw');
 if(w){const words=['la maternelle','le primaire','le collège et le lycée','l’enseignement technique','l’université'];let i=0;const id=setInterval(()=>{if(!w.isConnected){clearInterval(id);return}w.classList.add('out');setTimeout(()=>{i=(i+1)%words.length;w.textContent=words[i];w.classList.remove('out')},350)},2600)}}

async function hashPw(email,pw){const s='ge|'+email.toLowerCase()+'|'+pw;try{const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return'x'+h}}

 const teacher=isTea()?myTeacher():null;
 const classList=visClasses();
 if(!classList.length)return'<div class="card">Aucune classe ne vous est affectée.</div>';
 if(!classList.find(c=>c.id===S.f.cls))S.f.cls=classList[0].id;
 const c=S.f.cls,t=S.f.term,mx=mxC(c),subs=subjectsFor(c),allowedSubs=teacher?subs.filter(x=>tSubs(teacher).includes(x.id)):subs;
 let sb=S.f.sub;
 if(teacher){if(!allowedSubs.find(x=>x.id===sb))sb=(allowedSubs[0]||{}).id||null}else if(sb!=='all'&&!subs.find(x=>x.id===sb))sb='all';
 S.f.sub=sb||'';
 if(!sb)return`<div class="card"><div class="filters">${clsSel(classList,c)}</div>Vous n’enseignez aucune matière dans cette classe.</div>`;
 const rk=ranking(c,t),cr=cls(c).level==='sup'?'Crédits':'Coef.';
 const subSel=`<label class="fl">${cls(c).level==='sup'?'Unité d’enseignement':'Matière'}<select data-chg="fsub">${teacher?'':'<option value="all">Toutes les matières</option>'}${allowedSubs.map(s=>`<option value="${s.id}" ${sb===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`;
 let table;
 if(sb==='all'){table=`<div class="tw"><table><thead><tr><th>#</th><th>Élève</th>${subs.map(s=>`<th class="c">${esc(s.short)}</th>`).join('')}<th class="c">Moyenne /${mx}</th><th class="c">Décision</th></tr></thead><tbody>${cstu(c).map((s,i)=>{const m=avg(s.id,t),ok=subs.every(x=>note(s.id,x.id,t)!=null);return`<tr><td>${i+1}</td><td><b>${esc(full(s))}</b></td>${subs.map(x=>`<td class="c">${note(s.id,x.id,t)??'–'}</td>`).join('')}<td class="c"><b>${f2(m)}</b></td><td class="c"><span class="pill ${ok?'':'o'}">${ok?'Validé':'En attente'}</span></td></tr>`}).join('')||'<tr><td colspan="9">Aucun élève dans cette classe.</td></tr>'}</tbody></table></div>`}
 else{const su=sub(sb);table=`<div class="tw"><table><thead><tr><th>#</th><th>Élève</th><th class="c">Note /${mx}</th><th class="c">${cr}</th><th class="c">Décision</th></tr></thead><tbody>${cstu(c).map((s,i)=>{const n=note(s.id,sb,t);return`<tr><td>${i+1}</td><td><b>${esc(full(s))}</b></td><td class="c"><input class="num" type="number" min="0" max="${mx}" step="0.25" data-sid="${s.id}" value="${n??''}" aria-label="Note de ${esc(full(s))}"></td><td class="c">${su.coef}</td><td class="c"><span class="pill ${n!=null?'':'o'}">${n!=null?'Validé':'En attente'}</span></td></tr>`}).join('')||'<tr><td colspan="5">Aucun élève dans cette classe.</td></tr>'}</tbody></table></div><div class="row end"><button class="btn" data-act="saveNotes">Enregistrer les notes</button></div>`}
 let extra='';
 if(sb==='all')extra=`<div class="grid gh" style="margin-top:16px"><div class="card"><h3>Classement</h3>${rankTable(c,t)}</div><div class="card"><h3>Bulletins</h3><div class="tw"><table><thead><tr><th>Élève</th><th class="c">Moyenne</th><th></th></tr></thead><tbody>${rk.map(x=>`<tr><td>${esc(full(x.s))}</td><td class="c">${f2(x.m)}</td><td><button class="btn sm" data-act="viewBul" data-id="${x.s.id}">Bulletin</button></td></tr>`).join('')}</tbody></table></div></div></div>`;
 return`<div class="card"><div class="filters">${clsSel(classList,c)}${subSel}${termSel()}</div>${table}</div>${extra}`}
A.saveNotes=()=>{const t=S.f.term,sb=S.f.sub,mx=mxC(S.f.cls),su=sub(sb);let n=0;document.querySelectorAll('input[data-sid]').forEach(i=>{const sid=i.dataset.sid,k=`${sid}|${sb}|${t}`,old=db.grades[k];let nv;if(i.value===''){nv=undefined;delete db.grades[k]}else{nv=Math.max(0,Math.min(mx,parseFloat(i.value)));db.grades[k]=nv;n++}if(old!==nv)hist('note',`${su.short} · ${termName(t,cls(S.f.cls).level)} : ${old==null?'–':old} → ${nv==null?'–':nv}`,{sid,cid:S.f.cls,p:t})});log('file','#7240e0',`Notes saisies (${su.short}, ${cls(S.f.cls).name})`);save();toast(`${n} note(s) enregistrée(s).`);rd()};
function rankTable(c,t){const mx=mxC(c);return`<div class="tw"><table><thead><tr><th class="c">Rang</th><th>Élève</th><th class="c">Moyenne /${mx}</th><th>Mention</th></tr></thead><tbody>${ranking(c,t).map(x=>{const v=x.m==null?0:x.m*20/mx;return`<tr><td class="c"><b>${x.rank}</b></td><td>${esc(full(x.s))}</td><td class="c">${f2(x.m)}</td><td><span class="pill ${v>=14?'':v>=10?'b':'r'}">${mention(x.m,mx)}</span></td></tr>`}).join('')||'<tr><td colspan="4">Aucun élève.</td></tr>'}</tbody></table></div>`}

A.paySid=()=>{const f=document.getElementById('payf');f.amount.value=feeFor(f.sid.value,f.type.value)||'';chkDup()};
function isDup(d){return db.payments.some(p=>p.sid===d.sid&&p.type===d.type&&p.amount===+d.amount&&p.date===todayISO())}
function chkDup(){const f=document.getElementById('payf');if(!f)return;const m=document.getElementById('dupmsg');const d={sid:f.sid.value,type:f.type.value,amount:f.amount.value};if(d.sid&&isDup(d)){m.className='dupko';m.textContent='Doublon détecté : ce paiement existe déjà aujourd’hui.'}else{m.className='dupok';m.textContent='✓ Aucun doublon détecté'}}

function payFormSubmit(e){e.preventDefault();const f=e.target,d={sid:f.sid.value,type:f.type.value,amount:+f.amount.value,mode:f.mode.value};
 if(!d.sid){toast('Sélectionnez un élève.');return}
 if(isDup(d)){toast('Paiement refusé : doublon détecté.');return}
 const rec=nextRec(),p={id:'p'+Date.now(),rec,sid:d.sid,type:d.type,amount:d.amount,mode:d.mode,date:todayISO(),ref:rec,at:Date.now(),by:S.user.name};db.payments.unshift(p);hist('paiement',`${rec} · ${d.type} · ${money(d.amount)} (${d.mode})`,{sid:d.sid});log('wallet','#17a673','Un paiement a été enregistré');save();toast('Paiement enregistré · '+rec);rd();showReceipt(p)}
function receiptHTML(p){const s=stu(p.sid),c=cls(s.cls);return`<div class="sheet"><div class="hd">${logo(1)}<div style="text-align:right"><b>REÇU DE PAIEMENT</b><br>${p.rec}</div></div><h2>Reçu n° ${p.rec}</h2><div class="kv"><span>${whoLabel(s)} : <b>${esc(full(s))}</b></span><span>Classe : <b>${esc(c.name)}</b></span><span>Matricule : <b>${s.mat}</b></span><span>Niveau : <b>${LV[c.level].n}</b></span><span>Date : <b>${p.at?dtfr(p.at):dfr(p.date)}</b></span><span>Mode : <b>${p.mode}</b></span><span>Motif : <b>${p.type}</b></span><span>Année : <b>${esc(db.settings.year)}</b></span></div><p style="font-size:20px;text-align:center;margin:24px 0">Montant reçu : <b>${money(p.amount)}</b></p><div class="row" style="justify-content:space-between;align-items:flex-end;margin-top:30px"><span>Le caissier</span><div class="stamp">${esc(db.settings.name).toUpperCase()}</div></div>${docMeta('rec',p.sid,{p})}</div>`}

/* documents */

function bulletinHTML(sid,t){const s=stu(sid),c=cls(s.cls),L=LV[c.level],mx=L.max,m=avg(sid,t),n=cstu(s.cls).length,sup=c.level==='sup';
 const title={mat:'Bulletin d’évaluation',pri:'Bulletin scolaire',sec:'Bulletin scolaire',sup:'Relevé semestriel'}[c.level];
 return`<div class="sheet"><div class="hd">${logo(1)}<h3 style="font-family:'Plus Jakarta Sans',sans-serif">${title}</h3></div><div class="kv"><span>Établissement : <b>${esc(db.settings.name)}</b></span><span>Nom : <b>${esc(full(s))}</b></span><span>${sup?'Année universitaire':'Année scolaire'} : <b>${esc(db.settings.year)}</b></span><span>Matricule : <b>${s.mat}</b></span><span>${sup?'Parcours':'Classe'} : <b>${esc(c.name)}${c.serie&&c.level==='sec'?' ('+esc(c.serie)+')':''}</b></span><span>Rang : <b>${m!=null?rankOf(s,t)+' / '+n:'–'}</b></span><span>Période : <b>${termName(t,c.level)}</b></span></div><div class="tw"><table><thead><tr><th>${sup?'Unités d’enseignement':'Matières'}</th><th class="c">Notes /${mx}</th><th class="c">${sup?'Crédits':'Coef.'}</th><th class="c">Moy. pondérée</th><th>Appréciation</th></tr></thead><tbody>${subjectsFor(s.cls).map(su=>{const v=note(sid,su.id,t);return`<tr><td>${esc(su.name)}</td><td class="c">${v??'–'}</td><td class="c">${su.coef}</td><td class="c">${v!=null?f2(v*su.coef):'–'}</td><td>${mention(v,mx)}</td></tr>`}).join('')}</tbody></table></div><p><b>Moyenne générale : ${f2(m)} /${mx}</b> · Mention : ${mention(m,mx)}</p><p>Appréciation : <i>${apprec(m,mx)}</i></p><div class="row" style="justify-content:space-between;align-items:flex-end;margin-top:20px"><span>Le Directeur</span><div>${sigHTML()}</div><div class="stamp">${esc(db.settings.name).toUpperCase()}</div></div>${docMeta('bul',sid,{t})}</div>`}
function releveHTML(sid){const s=stu(sid),c=cls(s.cls),L=LV[c.level],mx=L.max,subs=subjectsFor(s.cls),ps=Array.from({length:L.pn},(_,i)=>i+1),am=ps.map(t=>avg(sid,t)),ok=am.filter(x=>x!=null),gen=ok.length?ok.reduce((a,b)=>a+b,0)/ok.length:null;
 return`<div class="sheet"><div class="hd">${logo(1)}<span>${c.level==='sup'?'Année universitaire':'Année scolaire'} : ${esc(db.settings.year)}</span></div><h2>RELEVÉ DE NOTES</h2><div class="kv"><span>Nom : <b>${esc(full(s))}</b></span><span>Matricule : <b>${s.mat}</b></span><span>Né(e) le : <b>${dfr(s.born)}</b></span><span>Classe : <b>${esc(c.name)}</b></span></div><div class="tw"><table><thead><tr><th>Matière</th><th class="c">${c.level==='sup'?'Crédits':'Coef.'}</th>${ps.map(t=>`<th class="c">${termName(t,c.level)}</th>`).join('')}</tr></thead><tbody>${subs.map(su=>`<tr><td>${esc(su.name)}</td><td class="c">${su.coef}</td>${ps.map(t=>`<td class="c">${note(sid,su.id,t)??'–'}</td>`).join('')}</tr>`).join('')}<tr><th>Moyenne /${mx}</th><th></th>${am.map(a=>`<th class="c">${f2(a)}</th>`).join('')}</tr></tbody></table></div><p><b>Moyenne annuelle : ${f2(gen)} /${mx}</b> · Mention : ${mention(gen,mx)}</p><div class="row" style="justify-content:space-between;align-items:flex-end;margin-top:20px"><small>Fait à ${esc(db.settings.city)}, le ${dfr(todayISO())}</small><div style="text-align:center">Le Directeur<br>${sigHTML()}</div><div class="stamp">${esc(db.settings.name).toUpperCase()}</div></div>${docMeta('rel',sid)}</div>`}
function attHTML(sid,cert){const s=stu(sid),c=cls(s.cls),sup=c.level==='sup';return`<div class="sheet"><div class="hd">${logo(1)}<span>${sup?'Année universitaire':'Année scolaire'} : ${esc(db.settings.year)}</span></div><h2 style="font-size:24px;text-decoration:underline">${cert?'CERTIFICAT DE SCOLARITÉ':'ATTESTATION DE SCOLARITÉ'}</h2><p style="line-height:2">Le Directeur de l’établissement <b>${esc(db.settings.name)}</b> ${cert?'certifie':'atteste'} que :</p><p style="font-size:20px;text-align:center"><b>${esc(full(s))}</b></p><p style="line-height:2">Né(e) le : <b>${dfr(s.born)}</b><br>Matricule : <b>${s.mat}</b><br>Est régulièrement inscrit(e) ${sup?'en':'en classe de'} : <b>${esc(c.name)}${c.serie?' · '+esc(c.serie):''}</b> (${LV[c.level].n})<br>pour ${sup?'l’année universitaire':'l’année scolaire'} <b>${esc(db.settings.year)}</b>.</p><p>En foi de quoi, ce document est délivré pour servir et valoir ce que de droit.</p><div class="row" style="justify-content:space-between;align-items:flex-end;margin-top:24px"><small>Fait à ${esc(db.settings.city)}, le ${dfr(todayISO())}</small><div style="text-align:center">Le Directeur<br>${sigHTML()}</div><div class="stamp">${esc(db.settings.name).toUpperCase()}</div></div>${docMeta(cert?'cer':'att',sid)}</div>`}

function shrink(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const side=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=max;c.getContext('2d').drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,max,max);res(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)})}

 if(k==='stu'&&canPhoto('stu')){const s=stu(id);if(s)s.photo=url}
 else if(k==='tea'&&canPhoto('tea')){const t=db.teachers.find(x=>String(x.id)===id);if(t)t.photo=url}
 else if(k==='acc'){const a=db.accounts.find(x=>x.email===id);if(a&&a.email===S.user.email){a.photo=url;if(a.role==='student'&&stu(a.studentId))stu(a.studentId).photo=url}}
 else if(k==='logo'&&isAdm()){db.settings.logo=url;SCHOOL_LOGO=url}

async function mkTeacher(d,cid){
 const email=normId(d.email);
 if(!email){toast('Saisissez une adresse e-mail valide ou un numéro à 10 chiffres.');return}
 if(d.pw.length<6){toast('Mot de passe trop court.');return}
 if(db.accounts.some(a=>a.email.toLowerCase()===email)){toast('Cette adresse existe déjà.');return}
 const level=d.tlv||'sec', gender=d.sexe||'M', chosenClass=d.cls?cls(d.cls):null;
 if(chosenClass&&chosenClass.level!==level){toast('La classe choisie ne correspond pas au niveau d’enseignement.');return}
 let subjects=[],classes=[],role;
 if(level==='mat'||level==='pri'){
  if(!chosenClass){toast('Choisissez une classe du niveau sélectionné.');return}
  classes=[chosenClass.id];subjects=db.subjects.filter(su=>su.tags.includes(ctag(chosenClass))).map(su=>su.id);role=level==='mat'?'tea_mat':'tea_pri';
 }else{
  const su=(d.subjectOther&&d.subjectOther.trim())?resolveSubject(level,d):sub(d.subject);if(!su){toast('Choisissez une matière.');return}
  if(level==='sup'&&!su.tags.includes('sup')){toast('Choisissez une matière du supérieur.');return}
  if(level==='sec'&&!su.tags.some(tag=>['g1','gl','gs','ti','tg'].includes(tag))){toast('Choisissez une matière du secondaire.');return}
  subjects=[su.id];classes=db.classes.filter(c=>c.level===level&&su.tags.includes(ctag(c))).map(c=>c.id);role=tRoleFor(su);
 }
 const id=Date.now(),name=d.name.trim(),t={id,name,subjects,classes,email,sexe:gender,level};
 db.teachers.push(t);db.accounts.push({email,role,name,teacherId:id,active:true,h:await hashPw(email,d.pw)});
 log('user','#1d6fe8','Un enseignant a été ajouté');save();toast('Enseignant ajouté, compte créé.');rd()
}

function trStr(str){
 if(LANG!=='en'||!str)return str;
 const lead=str.match(/^\s*/)[0],trail=str.match(/\s*$/)[0],core=nrm(str);if(!core)return str;
 let t=EN[core];
 if(t===undefined&&/\s?:$/.test(core)){const b=nrm(core.replace(/\s*:$/,''));if(EN[b]!==undefined)t=EN[b]+':'}
 if(t===undefined){
  for(const[re,rp]of PAT){if(re.test(core)){t=core.replace(re,rp);break}}
  if(t===undefined&&/[\d·\/(),]/.test(core))t=core;
  if(t!==undefined){let ch=t!==core;for(const k of ENK){if(t.includes(k)){t=t.split(k).join(EN[k]);ch=true}}if(!ch)return str}}
 return t===undefined?str:lead+t+trail}
function trDOM(root){
 if(LANG!=='en'||!root||!document.createTreeWalker)return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),arr=[];let n;while((n=w.nextNode()))arr.push(n);
 arr.forEach(n=>{const p=n.parentNode&&n.parentNode.nodeName;if(p==='SCRIPT'||p==='STYLE'||p==='TEXTAREA')return;const v=n.nodeValue;if(!v.trim())return;const t=trStr(v);if(t!==v)n.nodeValue=t});
 root.querySelectorAll('[placeholder],[title],[aria-label],[alt],optgroup[label]').forEach(el=>['placeholder','title','aria-label','alt','label'].forEach(a=>{if(el.hasAttribute(a)){const v=el.getAttribute(a),t=trStr(v);if(t!==v)el.setAttribute(a,t)}}))}
if(typeof MutationObserver!=='undefined'){
 const mo=new MutationObserver(()=>{if(LANG==='en'&&!mo._p){mo._p=1;Promise.resolve().then(()=>{mo._p=0;['#root','#modal','#toast'].forEach(s=>trDOM($(s)))})}});
 ['#root','#modal','#toast'].forEach(s=>{const e=$(s);if(e)mo.observe(e,{childList:true,subtree:true})})}

function docMeta(kind,sid,o={}){
 const s=stu(sid),c=cls(s.cls),now=Date.now(),code={bul:'BUL',rel:'REL',att:'ATT',cer:'CER',rec:'REC'}[kind];
 const ref=`${code}-${ldate(now).split('/').reverse().join('')}-${s.mat}${o.p?'-'+o.p.rec.slice(-4):''}`;
 let ev=(db.history||[]).filter(h=>h.sid===sid);
 if(kind==='bul'||kind==='rel')ev=ev.filter(h=>h.type==='note'&&(kind==='rel'||h.p===o.t));
 else if(kind==='rec')ev=ev.filter(h=>h.type==='paiement'||h.type==='inscription');
 else ev=ev.filter(h=>['inscription','modification','document'].includes(h.type));
 ev=ev.slice(0,10);
 const kv=[['Document n°',ref],['Édité le',dtfr(now)],['Édité par',esc(S.user?S.user.name:'—')]];
 if(kind==='bul'){kv.push(['Période',`${termName(o.t,c.level)} (${periodRange(o.t,c.level)})`]);const ln=(db.history||[]).find(h=>h.sid===sid&&h.type==='note'&&h.p===o.t);kv.push(['Dernière saisie de note',ln?dtfr(ln.t):'–'])}
 if(kind==='rel'){const ln=(db.history||[]).find(h=>h.sid===sid&&h.type==='note');kv.push(['Dernière saisie de note',ln?dtfr(ln.t):'–'])}
 if(kind==='att'||kind==='cer'){kv.push(['Inscrit(e) depuis le',enrolDate(s)])}
 if(kind==='rec'){const p=o.p;kv.push(['Paiement enregistré le',p.at?dtfr(p.at):dfr(p.date)]);kv.push(['Enregistré par',esc(p.by||'—')]);
  const tot=paidScol(sid);kv.push(['Total versé',money(db.payments.filter(x=>x.sid===sid).reduce((a,x)=>a+x.amount,0))]);kv.push(['Solde restant',money(solde(sid))])}
 let ph='';
 if(kind==='rec'){let cum=0;const l=db.payments.filter(x=>x.sid===sid).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.at||0)-(b.at||0));ph=`<h4>Historique des versements</h4><table><thead><tr><th>Date</th><th>Reçu</th><th>Frais</th><th class="c">Montant</th><th class="c">Cumul</th></tr></thead><tbody>${l.map(x=>{cum+=x.amount;return`<tr><td>${x.at?dtfr(x.at):dfr(x.date)}</td><td>${x.rec}</td><td>${esc(x.type)}</td><td class="c">${fmt(x.amount)}</td><td class="c">${fmt(cum)}</td></tr>`}).join('')}</tbody></table>`}
 const evh=`<h4>Historique</h4>${ev.length?`<table><thead><tr><th>Date et heure</th><th>Action</th><th>Détail</th><th>Par</th></tr></thead><tbody>${ev.map(h=>`<tr><td>${dtfr(h.t)}</td><td>${HLBL[h.type]||h.type}</td><td>${esc(h.detail)}</td><td>${esc(h.by)}</td></tr>`).join('')}</tbody></table>`:'<p style="margin:2px 0">Aucun événement enregistré.</p>'}`;
 return`<div class="docmeta"><div class="kv">${kv.map(([l,v])=>`<span>${l} : <b>${v}</b></span>`).join('')}</div>${ph}${evh}</div>`}

const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const subtle=()=>typeof crypto!=='undefined'&&crypto.subtle?crypto.subtle:null;
async function sha(str){const sb=subtle();if(sb){const h=await sb.digest('SHA-256',new TextEncoder().encode(str));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return'x'+h}
async function aesKey(pass,salt){const sb=subtle(),km=await sb.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return sb.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encPkg(obj,pass){const txt=JSON.stringify(obj),sb=subtle();if(!sb||!pass)return{plain:txt};const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await aesKey(pass,salt),ct=await sb.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(txt));return{salt:b64(salt),iv:b64(iv),data:b64(new Uint8Array(ct))}}
async function decPkg(pkg,pass){if(pkg.plain)return JSON.parse(pkg.plain);const sb=subtle();if(!sb)throw new Error('nocrypto');const key=await aesKey(pass,unb64(pkg.salt)),pt=await sb.decrypt({name:'AES-GCM',iv:unb64(pkg.iv)},key,unb64(pkg.data));return JSON.parse(new TextDecoder().decode(pt))}
const pkgStr=p=>p.plain||(p.salt+p.iv+p.data);
function snapshot(){const strip=a=>a.map(x=>{const y={...x};delete y.photo;return y});return{year:db.settings.year,takenAt:Date.now(),classes:db.classes,subjects:db.subjects,teachers:strip(db.teachers),students:strip(db.students),grades:db.grades,payments:db.payments,docs:db.docs,history:db.history||[],settings:{name:db.settings.name,year:db.settings.year,city:db.settings.city,lvFees:db.settings.lvFees}}}
async function makeArchive(pass,label,by){const snap=snapshot(),pkg=await encPkg(snap,pass),h=await sha(pkgStr(pkg)),a=loadArch();
 const rec={id:'ar'+Date.now(),label,year:snap.year,at:snap.takenAt,by,enc:!pkg.plain,pkg,h,n:{students:snap.students.length,payments:snap.payments.length,grades:Object.keys(snap.grades).length,classes:snap.classes.length,paid:snap.payments.reduce((x,p)=>x+p.amount,0)}};
 a.unshift(rec);return saveArch(a)?rec:null}
const nextYearLabel=()=>{const y=Math.max(startYear()+1,acadNow());return`${y} - ${y+1}`};
function yearBanner(){if(!isAdm())return'';const cur=acadNow();if(startYear()>=cur)return'';return`<div class="card" style="margin-bottom:16px;border-color:var(--orange)"><h3>Nouvelle année ${cur} - ${cur+1}</h3><p style="margin:0 0 10px">Archivez l’année <b>${esc(db.settings.year)}</b> (chiffrée), puis démarrez la nouvelle année.</p><button class="btn green" data-act="newYear">Archiver et démarrer ${cur} - ${cur+1}</button></div>`}
function dlFile(name,text){const b=new Blob([text],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},600)}
A.printDeparted=el=>{const r=(db.departed||[]).find(x=>x.studentId===el.dataset.id),s=stu(el.dataset.id)||(r&&r.student);if(!s)return;const c=cls(s.cls)||{},payments=db.payments.filter(p=>p.sid===s.id),events=(db.history||[]).filter(h=>h.sid===s.id),grades=db.subjects.filter(su=>su.tags.includes(ctag(c))).map(su=>({name:su.name,terms:[1,2,3].map(t=>note(s.id,su.id,t))}));const html=`<div class="sheet"><h2>DOSSIER SCOLAIRE ARCHIVÉ</h2><p><b>Nom :</b> ${esc(full(s))} · <b>Matricule :</b> ${esc(s.mat||'—')}</p><p><b>Dernière classe :</b> ${esc(c.name||'—')} · <b>Niveau :</b> ${esc((LV[c.level]||{}).n||'—')}</p><p><b>Date de naissance :</b> ${esc(s.born||'—')} · <b>Sexe :</b> ${esc(s.sexe||'—')}</p><p><b>Parent/tuteur :</b> ${esc(s.parent||'—')} · <b>Téléphone :</b> ${esc(s.phone||'—')} · <b>E-mail :</b> ${esc(s.email||'—')}</p><p><b>Date de sortie :</b> ${esc(r?.date||s.departedAt||'—')} · <b>Motif :</b> ${esc(r?.reason||s.departureReason||'—')}</p><h3>Notes et résultats</h3><table><thead><tr><th>Matière</th><th>Période 1</th><th>Période 2</th><th>Période 3</th></tr></thead><tbody>${grades.map(g=>`<tr><td>${esc(g.name)}</td>${g.terms.map(v=>`<td>${v??'—'}</td>`).join('')}</tr>`).join('')}</tbody></table><h3>Paiements</h3><table><thead><tr><th>Date</th><th>Reçu</th><th>Type</th><th>Montant</th></tr></thead><tbody>${payments.map(p=>`<tr><td>${esc(p.date||'—')}</td><td>${esc(p.rec||'—')}</td><td>${esc(p.type||'—')}</td><td>${fmt(p.amount||0)} FCFA</td></tr>`).join('')||'<tr><td colspan="4">Aucun paiement enregistré.</td></tr>'}</tbody></table><h3>Historique des activités</h3><table><thead><tr><th>Date</th><th>Action</th><th>Détail</th><th>Par</th></tr></thead><tbody>${events.map(h=>`<tr><td>${dtfr(h.t)}</td><td>${esc(HLBL[h.type]||h.type)}</td><td>${esc(h.detail)}</td><td>${esc(h.by)}</td></tr>`).join('')||'<tr><td colspan="4">Aucun historique disponible.</td></tr>'}</tbody></table><p>Document généré le ${dtfr(Date.now())} par ${esc(S.user.name)}.</p></div>`;modal(html+`<div class="row end noprint"><button class="btn ghost" data-act="close">Fermer</button><button class="btn" data-act="print">Imprimer / PDF</button></div>`,true)};
PAGES.archives=function(){const a=loadArch(),sec=!!subtle();
 return`<div class="card"><h3>Archives annuelles <span class="row"><button class="btn sm" data-act="backup">Sauvegarder maintenant</button><button class="btn sm green" data-act="newYear">Clôturer l’année et démarrer la nouvelle</button></span></h3><p style="margin:0 0 12px;color:var(--muted)">Année en cours : <b style="color:var(--text)">${esc(db.settings.year)}</b>. ${sec?'Chiffrement AES-256 actif : seules les personnes qui connaissent le mot de passe peuvent lire une archive.':'⚠ Le chiffrement n’est pas disponible ici (ouvrez le site en https ou sur localhost) : les archives sont enregistrées sans chiffrement.'}</p><div class="tw"><table><thead><tr><th>Année</th><th>Date</th><th>Par</th><th>Contenu</th><th>Sécurité</th><th></th></tr></thead><tbody>${a.map(r=>`<tr><td><b>${esc(r.label||r.year)}</b></td><td>${dtfr(r.at)}</td><td>${esc(r.by)}</td><td>${r.n.students} · ${r.n.payments} · ${r.n.grades}</td><td>${r.enc?'<span class="pill">Chiffrée</span>':'<span class="pill o">Non chiffrée</span>'}</td><td class="row"><button class="btn ghost sm" data-act="arkView" data-id="${r.id}">Consulter</button><button class="btn ghost sm" data-act="arkCheck" data-id="${r.id}">Vérifier</button><button class="btn ghost sm" data-act="arkExport" data-id="${r.id}">Exporter</button>${S.user.role==='founder'?`<button class="btn ghost sm" data-act="arkDel" data-id="${r.id}" aria-label="Supprimer">${ic('trash')}</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">Aucune archive pour le moment.</td></tr>'}</tbody></table></div><small style="color:var(--muted)">Contenu : élèves · paiements · notes.</small></div>`};
A.arkCheck=async el=>{const r=loadArch().find(x=>x.id===el.dataset.id);if(!r)return;toast((await sha(pkgStr(r.pkg)))===r.h?'Intégrité vérifiée ✓':'Archive altérée ✗ : ne pas utiliser.')};
A.arkExport=el=>{const r=loadArch().find(x=>x.id===el.dataset.id);if(r)dlFile(`archive-${String(r.label||r.year).replace(/[^\w-]+/g,'-')}.json`,JSON.stringify(r))};
A.arkDel=el=>{if(S.user.role!=='founder'||!confirm(trStr('Supprimer cette archive ? Cette action est définitive.')))return;saveArch(loadArch().filter(x=>x.id!==el.dataset.id));hist('archive','Archive supprimée');rd()};
A.arkView=el=>{const r=loadArch().find(x=>x.id===el.dataset.id);if(!r)return;
 const show=async pass=>{let snap;try{snap=await decPkg(r.pkg,pass)}catch(e){toast('Mot de passe incorrect ou archive illisible.');return}
  const lvc=k=>snap.classes.filter(c=>c.level===k).map(c=>c.id),by=Object.keys(LV).map(k=>[LV[k].n,snap.students.filter(s=>lvc(k).includes(s.cls)).length]);
  const cn=id=>(snap.classes.find(c=>c.id===id)||{}).name||id;
  modal(`<h3>${esc(r.label||r.year)}</h3><div class="ttleg">${by.map(([n,c])=>`<span>${esc(n)} : ${c}</span>`).join('')}<span>${money(snap.payments.reduce((a,p)=>a+p.amount,0))}</span></div><div class="tw" style="max-height:340px;overflow:auto"><table><thead><tr><th>Matricule</th><th>Nom et prénom</th><th>Classe</th></tr></thead><tbody>${snap.students.slice(0,200).map(s=>`<tr><td>${esc(s.mat)}</td><td>${esc(s.last+' '+s.first)}</td><td>${esc(cn(s.cls))}</td></tr>`).join('')}</tbody></table></div><div class="row end"><button class="btn ghost" data-act="close">Fermer</button><button class="btn" data-act="arkRaw" data-id="${r.id}">Télécharger le contenu</button></div>`,1);
  window._arkSnap=snap};
 if(!r.enc){show('');return}
 modal(`<h3>Mot de passe de l’archive</h3><form id="arkf" style="display:grid;gap:12px"><label class="fl">Mot de passe<input name="p" type="password" required autocomplete="off"></label><div class="row end"><button type="button" class="btn ghost" data-act="close">Annuler</button><button class="btn">Consulter</button></div></form>`);
 $('#arkf').onsubmit=e=>{e.preventDefault();const p=new FormData(e.target).get('p');closeModal();show(p)}};
A.arkRaw=el=>{const r=loadArch().find(x=>x.id===el.dataset.id);if(window._arkSnap)dlFile(`contenu-${String(r.label||r.year).replace(/[^\w-]+/g,'-')}.json`,JSON.stringify(window._arkSnap,null,1))};
function arkForm(title,withYear){modal(`<h3>${title}</h3><form id="arf" style="display:grid;gap:12px">${withYear?`<p style="margin:0;color:var(--muted)">L’année <b>${esc(db.settings.year)}</b> est enregistrée dans une archive chiffrée, puis la nouvelle année commence. Les élèves, classes, enseignants et comptes sont conservés.</p><label class="fl">Nouvelle année<input name="ny" required value="${esc(nextYearLabel())}"></label>`:''}<label class="fl">Mot de passe des archives (8 caractères minimum)<input name="ap" type="password" minlength="8" required autocomplete="new-password"></label><label class="fl">Confirmer<input name="ap2" type="password" minlength="8" required autocomplete="new-password"></label>${withYear?`<label class="row" style="gap:8px"><input type="checkbox" name="reset" checked> Effacer les notes, paiements et documents de l’année écoulée (ils restent dans l’archive)</label>`:''}<div class="row end"><button type="button" class="btn ghost" data-act="close">Annuler</button><button class="btn green">${withYear?'Archiver et démarrer':'Sauvegarder maintenant'}</button></div></form>`);
 $('#arf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('ap')!==f.get('ap2')){toast('Les mots de passe ne correspondent pas.');return}
  const lab=withYear?`Année ${db.settings.year}`:`Sauvegarde du ${ldate(Date.now())}`;const rec=await makeArchive(f.get('ap'),lab,S.user.name);if(!rec)return;
  if(withYear){if(f.get('reset')){db.grades={};db.payments=[];db.docs=[];db.activities=[]}db.settings.year=String(f.get('ny')).trim()||nextYearLabel();hist('archive',`${lab} archivée · nouvelle année ${db.settings.year}`);toast('Nouvelle année démarrée.')}else{hist('archive',lab);toast('Archive créée.')}
  save();closeModal();rd()}}
A.newYear=()=>{if(isAdm())arkForm('Archiver l’année et démarrer la nouvelle',true)};
A.backup=()=>{if(isAdm())arkForm('Sauvegarde chiffrée',false)};

A.purgeDemo=()=>{if(S.user.role!=='founder')return;const real=db.accounts.filter(a=>a.h&&['founder','admin'].includes(a.role));
 if(!real.length){toast('Créez d’abord votre propre compte fondateur ou administrateur (Utilisateurs → Créer un compte).');return}
 if(!confirm(trStr('Supprimer tous les comptes de démonstration ?')))return;
 db.accounts=db.accounts.filter(a=>a.h);hist('compte','Comptes de démonstration supprimés');save();toast('Comptes de démonstration supprimés.');if(!S.user.h)A.logout();else rd()};
const _parametres=PAGES.parametres;
PAGES.parametres=function(){const demo=db.accounts.filter(a=>!a.h).length;return _parametres()+(S.user.role==='founder'?`<div class="card" style="max-width:600px;margin-top:16px"><h3>Mise en ligne</h3><p style="margin:0 0 10px;color:var(--muted)">Avant de publier le site : créez votre compte fondateur, changez les codes ci-dessus, puis retirez les comptes de démonstration (mot de passe public demo1234). ${demo} compte(s) de démonstration présent(s).</p><button class="btn red" data-act="purgeDemo">Supprimer les comptes de démonstration</button></div>`:'')};
A.reload=()=>{location.hash='#/';location.reload()};

/* ============ vérification par code (e-mail ou SMS) ============ */
const VER={api:'api/verify.php',ttl:600000,cool:60000};
let V=null,_demoCode=null;
const gen6=()=>String(crypto.getRandomValues(new Uint32Array(1))[0]%1000000).padStart(6,'0');
async function vApi(body){const r=await fetch(VER.api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'});const j=await r.json();return j}
function vMask(id){if(isPhoneId(id)){const d=id.slice(4);return`+229 ${d.slice(0,2)} •• •• •• ${d.slice(8)}`}const[u,h]=id.split('@');return(u.length>2?u.slice(0,2)+'•••':u[0]+'•••')+'@'+h}
const V_ERR={sms_not_configured:'L’envoi de SMS n’est pas encore configuré sur ce site. Utilisez l’e-mail.',mail_failed:'L’e-mail n’a pas pu être envoyé. Réessayez plus tard.',expired:'Code expiré. Demandez un nouveau code.',locked:'Trop de tentatives. Demandez un nouveau code.',wrong:'Code incorrect.',none:'Demandez d’abord un code.',network:'Impossible de contacter le serveur. Réessayez.'};
/* envoi : serveur (api/verify.php) si disponible, sinon mode démonstration (code affiché à l'écran) */
async function sendCode(id){
 if(location.protocol!=='file:'){try{const j=await vApi({action:'send',target:id,lang:LANG});
  if(j&&j.ok&&j.demo){V.demoCode=j.code;return{mode:'demo-server'}}
  if(j&&j.ok)return{mode:'server'};
  if(j&&j.error==='cooldown')return{mode:'server'};
  if(j&&j.error)return{error:j.error}}catch(e){/* pas d'API : mode démonstration */}}
 const code=gen6();_demoCode={id,code,exp:Date.now()+VER.ttl,tries:0};V.demoCode=code;return{mode:'demo'}}
async function checkCode(id,code){
 if(V&&V.mode==='demo'){const d=_demoCode;if(!d||d.id!==id)return{ok:false,error:'none'};if(Date.now()>d.exp)return{ok:false,error:'expired'};if(++d.tries>5)return{ok:false,error:'locked'};return code===d.code?{ok:true}:{ok:false,error:'wrong'}}
 try{return await vApi({action:'check',target:id,code})}catch(e){return{ok:false,error:'network'}}}
function startVerify(id){return new Promise(resolve=>{V={id,resolve,coolUntil:0,mode:null,demoCode:null,timer:null};vSend()})}
async function vSend(){const r=await sendCode(V.id);if(r.error){vShow(V_ERR[r.error]||'Impossible d’envoyer le code. Réessayez.',true);return}V.mode=r.mode;V.coolUntil=Date.now()+VER.cool;vShow('')}
function vShow(msg,fatal){
 const phone=isPhoneId(V.id);clearInterval(V.timer);
 modal(`<h3>Vérification</h3>${fatal?`<div class="err" role="alert">${esc(msg)}</div><div class="row end"><button class="btn ghost" data-act="vcancel">Fermer</button><button class="btn" data-act="vretry">Réessayer</button></div>`:`<p style="margin:0">${phone?'Un code à 6 chiffres a été envoyé par SMS au':'Un code à 6 chiffres a été envoyé par e-mail à'} <b>${esc(vMask(V.id))}</b>.</p>${V.mode==='demo'||V.mode==='demo-server'?`<div class="demo-code">Mode démonstration : aucun message n’est envoyé. Votre code est <b>${esc(V.demoCode)}</b></div>`:''}<form id="vf" style="display:grid;gap:12px"><input class="vone" name="c" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" placeholder="000000" required autofocus>${msg?`<div class="err" role="alert">${esc(msg)}</div>`:''}<div class="row end"><button type="button" class="btn ghost" data-act="vcancel">Annuler</button><button class="btn">Vérifier</button></div></form><div style="text-align:center"><button class="btn ghost sm" id="vres" data-act="vresend" disabled>Renvoyer le code</button> <small id="vcd" style="color:var(--muted)"></small></div>`}`);
 if(fatal)return;
 const f=$('#vf');if(f)f.onsubmit=async e=>{e.preventDefault();const c=String(new FormData(f).get('c')||'').replace(/\D/g,'');if(c.length!==6){vShow('Saisissez les 6 chiffres.');return}
  const r=await checkCode(V.id,c);if(r.ok){S.verified=V.id;const rs=V.resolve;clearInterval(V.timer);V=null;closeModal();toast('Vérification réussie ✓');rs(true)}else vShow(V_ERR[r.error]||V_ERR.wrong)};
 const tick=()=>{const b=$('#vres'),c=$('#vcd');if(!b||!V){clearInterval(V&&V.timer);return}const left=Math.ceil((V.coolUntil-Date.now())/1000);if(left>0){b.disabled=true;if(c)c.textContent=`Renvoyer dans ${left} s`}else{b.disabled=false;if(c)c.textContent=''}};
 tick();V.timer=setInterval(tick,1000)}
A.vcancel=()=>{if(!V)return;clearInterval(V.timer);const r=V.resolve;V=null;closeModal();r(false)};
A.vresend=()=>{if(V&&Date.now()>=V.coolUntil)vSend()};
A.vretry=()=>{if(V)vSend()};

/* ---- maintenance : erreurs inattendues ---- */
let _errT=0;
function crash(msg){try{const l=JSON.parse(localStorage.getItem('ge_errors')||'[]');l.unshift({t:Date.now(),m:String(msg).slice(0,300),u:location.hash});localStorage.setItem('ge_errors',JSON.stringify(l.slice(0,20)))}catch(e){}if(Date.now()-_errT>4000){_errT=Date.now();try{toast('Une erreur est survenue. Rechargez la page si le problème persiste.')}catch(e){}}}
window.addEventListener('error',e=>crash(e.message));
window.addEventListener('unhandledrejection',e=>crash(e.reason&&e.reason.message||e.reason));
function showSplash(){
 const rm=typeof matchMedia!=='undefined'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(rm||!document.createElement||!document.body||document.getElementById('splash'))return;
 const el=document.createElement('div');el.id='splash';el.setAttribute('aria-hidden','true');
 const name='GESTION ÉCOLE'.split('').map((ch,i)=>ch===' '?`<span class="sp-sp" style="--i:${i}"></span>`:`<span class="${i>=8?'ac':''}" style="--i:${i}">${ch}</span>`).join('');
 el.innerHTML=`<i class="sp-orb a"></i><i class="sp-orb b"></i><div class="sp-in"><div class="sp-mark">${ic('cap')}</div><div class="sp-name">${name}</div><div class="sp-tag">Une gestion simple pour une éducation de qualité</div><div class="sp-bar"><i></i></div></div><div class="sp-skip">Toucher pour passer</div>`;
 document.body.appendChild(el);document.body.classList.add('splashing');
 let done=false;const end=()=>{if(done)return;done=true;el.classList.add('hide');document.body.classList.remove('splashing');setTimeout(()=>el.remove(),1000)};
 el.addEventListener('click',end);setTimeout(end,3000)}
if(!/^#\/?(app|connexion)/.test(location.hash))showSplash();
route();
